version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cab_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
      POSTGRES_DB: cabdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cab_network

  # backend:
  #   build: ./cab-booking-app
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - db
  #   environment:
  #     - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/cabdb
  #   networks:
  #     - cab_network

volumes:
  postgres_data:

networks:
  cab_network:
    driver: bridge
